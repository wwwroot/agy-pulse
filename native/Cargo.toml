[package]
name = "agy-pulse-worker"
version = "1.0.0"
edition = "2024"
description = "Zero-unsafe native Rust file, search, mutation, and document worker for agy-pulse"
license = "MIT"

[[bin]]
name = "agy-pulse-worker"
path = "src/main.rs"

[dependencies]
csv = "1.3"
globset = "0.4"
lopdf = { version = "0.34", default-features = false, features = ["nom_parser"] }
quick-xml = "0.37"
rayon = "1.10"
regex = "1.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
similar = "2.6"
walkdir = "2.5"
zip = { version = "2.2", default-features = false, features = ["deflate"] }

[lints.rust]
unsafe_code = "forbid"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
