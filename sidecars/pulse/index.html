<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pulse</title>
    <style>
      html,
      body,
      #root {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      html,
      body {
        background: var(--background, #181818);
        color: var(--foreground, #e4e4e7);
      }
    </style>
    <link rel="stylesheet" href="/styles.css" />
    <script src="/preload.js"></script>
    <script defer src="/main.js"></script>
  </head>
  <body>
    <div id="root">
      <div
        id="agy-boot-fallback"
        style="padding:14px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;font-size:12px;color:var(--foreground,#9ca3af);"
      >
        Loading Pulse...
      </div>
    </div>
    <script>
      window.addEventListener('error', function (e) {
        if (window.__agyPulseMounted) return;
        var el = document.getElementById('agy-boot-fallback');
        if (el) el.textContent = 'Pulse error: ' + (e.message || 'failed to load script');
      });
      setTimeout(function () {
        if (window.__agyPulseMounted) return;
        var el = document.getElementById('agy-boot-fallback');
        if (el) el.textContent = 'Pulse UI failed to initialize. Try reloading the panel.';
      }, 6000);
    </script>
  </body>
</html>
