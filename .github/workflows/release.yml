name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-worker:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin_name: agy-pulse-worker.exe
            asset_name: agy-pulse-worker-win32-x64.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            bin_name: agy-pulse-worker
            asset_name: agy-pulse-worker-darwin-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            bin_name: agy-pulse-worker
            asset_name: agy-pulse-worker-darwin-x64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin_name: agy-pulse-worker
            asset_name: agy-pulse-worker-linux-x64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('native/Cargo.lock', 'native/Cargo.toml') }}

      - name: Build agy-pulse-worker
        run: cargo build --release --manifest-path native/Cargo.toml --target ${{ matrix.target }}

      - name: Stage release asset
        shell: bash
        run: |
          mkdir -p release-assets
          cp "native/target/${{ matrix.target }}/release/${{ matrix.bin_name }}" "release-assets/${{ matrix.asset_name }}"

      - name: Upload worker artifact
        uses: actions/upload-artifact@v4
        with:
          name: worker-${{ matrix.asset_name }}
          path: release-assets/${{ matrix.asset_name }}

  release:
    needs: build-worker
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download worker artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate SHA256SUMS.txt
        shell: bash
        run: |
          cd release-assets
          sha256sum agy-pulse-worker-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/agy-pulse-worker-*
            release-assets/SHA256SUMS.txt
          generate_release_notes: true
